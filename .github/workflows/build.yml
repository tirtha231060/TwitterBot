name: Android CI/CD Auto Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # অফিসিয়াল Gradle অ্যাকশন ব্যবহার করে নির্দিষ্ট কম্প্যাটিবল ভার্সন (8.4) সেট করা
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # যেহেতু আমরা সরাসরি Gradle সেটআপ করেছি, তাই ./gradlew এর বদলে শুধু gradle কমান্ড চলবে
    - name: Build Release APK
      run: gradle assembleRelease

    - name: Upload APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
